name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      # Pinned to the major used in development. Deliberately not
      # node-version-file, which would read the ">=20.9.0" engines range and
      # could silently jump to an untested major.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # No secrets needed: every page that touches Supabase or Anthropic is
      # server-rendered on demand, so nothing calls out during the build. That is
      # deliberate — it means CI never needs an API key, and it is asserted by
      # the build passing here with no environment configured at all.
      - run: pnpm build
